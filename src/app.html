<!doctype html>
<!-- lang is substituted per request in hooks (§8.5): the document has to be
     labelled in the language it was actually rendered in, for screen readers
     and for hyphenation. -->
<html lang="%zembil.lang%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#F4F0E8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0F0D0B" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Zembil" />
		<meta name="description" content="The family shopping list." />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
