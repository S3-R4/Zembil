<!doctype html>
<!-- lang and data-theme are substituted per request in hooks (§8.5, §10.1):
     the document has to be labelled in the language it was actually rendered
     in, for screen readers and for hyphenation — and painted in the member's
     theme from the FIRST frame, which is only possible from a value the server
     holds. `auto` is a real value here rather than a missing attribute; the
     token blocks in app.css match it explicitly. -->
<html lang="%zembil.lang%" data-theme="%zembil.theme%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#F4F0E8" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0F0D0B" media="(prefers-color-scheme: dark)" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Zembil" />
		<meta id="zembil-description" name="description" content="%zembil.description%" />
		<link
			id="zembil-manifest"
			rel="manifest"
			href="%sveltekit.assets%/manifest-%zembil.lang%.webmanifest"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
