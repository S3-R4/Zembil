<!doctype html>
<html lang="tr">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>Bağlantı yok · Zembil</title>
		<style>
			:root {
				color-scheme: light dark;
			}
			body {
				margin: 0;
				min-height: 100dvh;
				display: grid;
				place-items: center;
				padding: 24px;
				text-align: center;
				font-family: system-ui, sans-serif;
				background: #f4f0e8;
				color: #191510;
			}
			@media (prefers-color-scheme: dark) {
				body {
					background: #0f0d0b;
					color: #f0ebe1;
				}
				p {
					color: #b8afa2;
				}
			}
			h1 {
				font-size: 30px;
				letter-spacing: -0.02em;
				margin: 0 0 8px;
			}
			p {
				margin: 0;
				color: #6e6559;
				font-size: 17px;
			}
			button {
				margin-top: 24px;
				min-height: 68px;
				padding: 0 32px;
				border: 0;
				border-radius: 22px;
				background: #b15a2b;
				color: #fffcf6;
				font: inherit;
				font-size: 19px;
				font-weight: 700;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>Bağlantı yok</h1>
			<p>Listelerinizi göstermek için Zembil’in ağa bağlanması gerekiyor.</p>
			<button type="button" onclick="location.reload()">Yeniden dene</button>
		</main>
	</body>
</html>
