<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<title>No signal · Zembil</title>
		<!--
			Deliberately a STATIC page with no list on it. The service worker serves
			this when a navigation cannot reach the server, and a cached page with
			the family's shopping on it would be a page any later visitor to this
			browser could read. See src/service-worker.ts.
		-->
		<style>
			:root { color-scheme: light dark; }
			body {
				margin: 0; min-height: 100dvh; display: grid; place-items: center;
				padding: 24px; text-align: center; gap: 8px;
				font-family: 'DM Sans', system-ui, sans-serif;
				background: #f4f0e8; color: #191510;
			}
			@media (prefers-color-scheme: dark) { body { background: #0f0d0b; color: #f0ebe1; } }
			h1 { font-size: 30px; letter-spacing: -0.02em; margin: 0 0 4px; }
			p { margin: 0; color: #6e6559; font-size: 17px; }
			button {
				margin-top: 24px; height: 68px; padding: 0 32px; border: 0; border-radius: 22px;
				background: #b15a2b; color: #fffcf6; font: inherit; font-size: 19px; font-weight: 700;
			}
		</style>
	</head>
	<body>
		<div>
			<h1>No signal</h1>
			<p>Zembil needs the network to show your lists.</p>
			<button type="button" onclick="location.reload()">Retry</button>
		</div>
	</body>
</html>
